<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slice</title>
</head>
<style>
    * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
    }

    .slices {
        display: flex;
        justify-content: center;
        gap: 20px;
        border-radius: 5px;
        margin-top: 50px;
        width: 100%;
    }

    .slice {
        width: 50%;
        height: 30vh;
        display: none;
        align-items: center;
        justify-content: center;
    }

    .box1 {
        background-color: lightblue;
    }

    .visible {
        display: flex;
    }

    .remove {
        display: none;
    }

    .visible:hover .remove {
        display: block;
    }
</style>

<body>
    <button onclick="addNewSlider()">Add Slider</button>
    <div class="slices">
        <div class="slice box1 visible">
            <button class="remove" onclick="removeslice(this)">Remove</button>
        </div>

    </div>
    <div class="slices">
        <!-- <button class="btn" onclick="sliderHandelr1()">1</button>
        <button class="btn" onclick="sliderHandelr2()">2</button>
        <button class="btn" onclick="sliderHandelr3()">3</button> -->

        <button class="btn" data-index="1" data-id="1" onclick="sliderHandelr(1)">1</button>

    </div>

    <script src="./script.js"></script>
</body>

</html>
